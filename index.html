<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap & JavaScript Workshop</title>

    <!-- Latest compiled and minified CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <script src="index.js"></script>
  </head>

  <body class="bg-light">
    <div class="container-fluid">
      <div class="row">
        <nav
          class="col-md-2 d-none d-md-block bg-white sidebar border-end vh-100 position-fixed"
        >
          <div class="d-flex flex-column h-100 p-3">
            <!-- Top: Navigation links -->
            <div class="flex-grow-1 w-100">
              <h4 class="mb-4">Menu</h4>
              <ul class="nav nav-pills flex-column mb-auto w-100">
                <li class="nav-item">
                  <a href="#" class="nav-link link-dark">
                    <i class="bi bi-grid"></i> Dashboard
                  </a>
                </li>
                <li>
                  <a href="#" class="nav-link link-dark">
                    <i class="bi bi-people"></i> Users
                  </a>
                </li>
                <li>
                  <a href="#" class="nav-link active">
                    <i class="bi bi-list-task"></i> Tasks
                  </a>
                </li>
                <li>
                  <a href="#" class="nav-link link-dark">
                    <i class="bi bi-gear"></i> Settings
                  </a>
                </li>
              </ul>
            </div>

            <!-- Bottom: Username and Logout -->
            <div>
              <small>Username</small><br />
              <a href="#" class="text-decoration-none">
                <i class="bi bi-box-arrow-right"></i> Logout
              </a>
            </div>
          </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 offset-md-2">
          <h3 class="text-left mt-4">Tasks</h3>
          <hr
            class="mx-auto w-85 border border-secondary border-2 opacity-80"
          />

          <div class="container w-75 bg-white border rounded p-3 mt-4">
            <form id="form" novalidate>
              <div>
                <label for="title" class="form-label">Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  placeholder="Enter title"
                  name="title"
                  required
                />
                <div class="invalid-feedback">Please enter a title.</div>
              </div>

              <div class="mt-3">
                <label for="description" class="form-label">Description</label>
                <textarea
                  class="form-control"
                  rows="3"
                  id="description"
                  placeholder="Enter description"
                  name="description"
                  required
                ></textarea>
                <div class="invalid-feedback">Please enter a description.</div>
              </div>

              <div class="row mt-3">
                <div class="col-12 col-md-6 order-1">
                  <label for="date" class="form-label">Due Date</label>
                  <input
                    type="date"
                    class="form-control"
                    id="date"
                    name="date"
                    required
                  />
                  <div class="invalid-feedback">Please choose a date.</div>
                </div>

                <div class="col-12 col-md-6 mt-3 mt-md-0 order-2">
                  <label for="assignee" class="form-label"
                    >Assign to Person (Optional)</label
                  >
                  <select class="form-select" id="assignee" name="assignee">
                    <option value="">--Select Person (Optional)--</option>
                    <option value="Sven">Sven</option>
                    <option value="Karl">Karl</option>
                    <option value="John">John</option>
                  </select>
                </div>
              </div>

              <div class="mt-3">
                <label for="attachments" class="form-label">Attachments</label>
                <div class="input-group">
                  <input
                    type="file"
                    class="form-control"
                    id="attachments"
                    name="attachments"
                    multiple
                  />
                  <button
                    class="btn btn-outline-danger"
                    type="button"
                    id="clearAttachment"
                  >
                    &times;
                  </button>
                </div>

                <ul
                  class="list-group mt-2 border rounded p-4"
                  id="fileList"
                ></ul>
              </div>

              <div class="mt-3 text-end">
                <button type="submit" id="submitForm" class="btn btn-primary">
                  + Add Todo
                </button>
              </div>
            </form>
          </div>

          <div class="container w-75 bg-white border rounded p-3 mt-4">
            <div class="card mt-3">
              <div class="card-header">
                <div class="row align-items-center">
                  <div class="col">
                    <h3 class="mb-0">Todos</h3>
                  </div>
                  <div class="col-auto">
                    <div class="btn-group">
                      <button
                        class="btn btn-sm btn-outline-secondary"
                        title="Filter"
                      >
                        <i class="bi bi-funnel"></i>
                      </button>
                      <button
                        class="btn btn-sm btn-outline-secondary"
                        title="Sort"
                      >
                        <i class="bi bi-sort-down"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div id="card-body" class="card-body"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
