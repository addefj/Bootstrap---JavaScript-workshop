<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap & JavaScript Workshop</title>

    <!-- Latest compiled and minified CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </head>
  <body class="bg-secondary">
    <div class="container-fluid">
      <h1 class="text-center display-3">My Todo App</h1>
      <div class="container bg-white border rounded border p-3 mt-4">
        <form>
          <div>
            <label for="title" class="form-label">Title</label>
            <input
              type="text"
              class="form-control"
              id="title"
              placeholder="Enter title"
              name="title"
            />
          </div>

          <div class="mt-3">
            <label for="description" class="form-label">Description</label>
            <textarea
              class="form-control"
              rows="3"
              id="description"
              placeholder="Enter description"
              name="description"
            ></textarea>
          </div>

          <div class="row mt-3">
            <div class="col">
              <label for="date" class="form-label">Due Date</label>
              <input type="date" class="form-control" id="date" name="date" />
            </div>

            <div class="col">
              <label for="assignee" class="form-label"
                >Assign to Person (Optional)</label
              >
              <select class="form-select" id="assignee" name="assignee">
                <option value="">--Select Person (Optional)--</option>
              </select>
            </div>
          </div>

          <div class="mt-3">
            <label for="attachments" class="form-label">Attachments</label>
            <div class="input-group">
              <input
                type="file"
                class="form-control"
                id="attachments"
                name="attachments"
                multiple
              />
              <button
                class="btn btn-outline-danger"
                type="button"
                id="clearAttachment"
              >
                &times;
              </button>
            </div>

            <ul class="list-group mt-2 border rounded p-4" id="fileList"></ul>
          </div>

          <div class="mt-3 text-end">
            <button type="button" class="btn btn-primary">+ Add Todo</button>
          </div>
        </form>
      </div>
    </div>

    <div class="container bg-white border rounded p-3 mt-4">
      <div class="card mt-3">
        <div class="card-header">
          <div class="row align-items-center">
            <div class="col">
              <h3 class="mb-0">Todos</h3>
            </div>
            <div class="col-auto">
              <div class="btn-group">
                <button class="btn btn-sm btn-outline-secondary" title="Filter">
                  <i class="bi bi-funnel"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary" title="Sort">
                  <i class="bi bi-sort-down"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="border rounded p-2">
            <div class="row align-items-center">
              <div class="bg-primary col-md-6">
                <h5 class="card-title mb-0">Example Todo</h5>
              </div>
              <div class="col-md-6 text-end">
                <div class="d-inline-block me-3 text-muted">
                  <small>Created: 2025-07-01</small>
                </div>
                <div class="btn-group">
                  <button
                    class="btn btn-sm btn-outline-secondary"
                    title="Mark as done"
                  >
                    <i class="bi bi-check-circle"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" title="Edit">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button
                    class="btn btn-sm btn-outline-secondary"
                    title="Delete"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>

            <p class="card-text mb-1">Description goes here</p>

            <div class="row gx-2 gy-0">
              <div class="col-auto">
                <small class="text-muted">
                  <i class="bi bi-calendar-event"></i> Due: 2025-07-10
                </small>
              </div>
              <div class="col-auto">
                <span class="badge bg-info text-dark">John Doe</span>
              </div>
              <div class="col-auto">
                <span class="badge bg-secondary">2 attachments</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <br />
  </body>
</html>
